version: 2

project_name: gitstead

builds:
  - id: gitstead
    main: .
    binary: gitstead
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

# Multi-arch image built by buildx from the pre-compiled binaries (dockers_v2
# builds the manifest itself, replacing the old dockers + docker_manifests).
dockers_v2:
  - images:
      - ashtonian/gitstead
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    dockerfile: Dockerfile.goreleaser
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.source: "https://github.com/ashtonian/gitstead"

homebrew_casks:
  - name: gitstead
    repository:
      owner: ashtonian
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/ashtonian/gitstead"
    description: "Keep every git repo you work on cloned, in sync and backed up, across accounts and forges"
    # The binaries aren't signed and notarized, so macOS would refuse the
    # first run of a downloaded one.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/gitstead"]
          end
    caveats: |
      Get started with `gitstead setup`. Before uninstalling, remove the
      background sync with `gitstead install-agent --uninstall`.

release:
  github:
    owner: ashtonian
    name: gitstead
  # v1.0.0-rc.1 and the like are marked pre-releases.
  prerelease: auto
