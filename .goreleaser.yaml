version: 2

project_name: gitstead

builds:
  - id: gitstead
    main: .
    binary: gitstead
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

# Multi-arch image built by buildx from the pre-compiled binaries (dockers_v2
# builds the manifest itself, replacing the old dockers + docker_manifests).
dockers_v2:
  - images:
      - ashtonian/gitstead
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    dockerfile: Dockerfile.goreleaser
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.source: "https://github.com/ashtonian/gitstead"

homebrew_casks:
  - name: gitstead
    repository:
      owner: ashtonian
      name: homebrew-tap
      branch: main
      # Pushed over SSH with a deploy key that can write to the tap and
      # nothing else; the workflow's own token can't push to another repo.
      git:
        url: "git@github.com:ashtonian/homebrew-tap.git"
        private_key: "{{ .Env.HOMEBREW_TAP_SSH_KEY }}"
    homepage: "https://github.com/ashtonian/gitstead"
    description: "Find, clone and sync every repo you work on, then launch coding agents on them"
    # The binaries aren't notarized, and Homebrew quarantines what it
    # downloads, so macOS would refuse to run gitstead: clear the quarantine
    # after install. Homebrew 7 deprecates postflight blocks, which
    # hooks.post.install generates, for declarative postflight_steps; until
    # GoReleaser emits those (hooks.post.install_steps, after v2.18), the
    # stanza goes in raw.
    custom_block: |
      on_macos do
        postflight_steps do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "gitstead"], chdir: ".", writable_paths: ["gitstead"]
        end
      end
    caveats: |
      Get started with `gitstead setup`. Before uninstalling, remove the
      background sync with `gitstead install-agent --uninstall`.

release:
  github:
    owner: ashtonian
    name: gitstead
  # v1.0.0-rc.1 and the like are marked pre-releases.
  prerelease: auto
