env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  CI_ARTIFACT_ENDPOINT: ${{ secrets.CI_ARTIFACT_ENDPOINT }}

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# A newer push to a pull request supersedes its run in progress. Runs for
# master each finish, since each one publishes :edge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# A pull request's run ends by recording a receipt of the tested merge tree
# (go-ci-actions acceptance). The push that merges it skips the checks that
# passed on the same tree and only builds and pushes :edge.
jobs:
  acceptance:
    name: reuse pull request validation
    if: github.event_name == 'push' && github.actor_id == '4212452'
    permissions:
      contents: read
      actions: read
      id-token: write
    runs-on: arc-gitstead
    timeout-minutes: 5
    outputs:
      reused: ${{ steps.verify.outputs.reused }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: verify
        uses: ashtonian/go-ci-actions/acceptance@4425a5fdd39bd4f2fba5be7ee71314b145a6e591 # v1.8.0 candidate (go-ci-actions#18)
        with:
          mode: verify
          variables: ${{ toJSON(vars) }}
  test:
    needs: acceptance
    # !cancelled() runs the job when acceptance is skipped, as on pull requests.
    if: ${{ !cancelled() && needs.acceptance.outputs.reused != 'true' && github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository)) }}
    permissions:
      contents: read
      id-token: write
    runs-on: arc-gitstead
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ashtonian/go-ci-actions@4425a5fdd39bd4f2fba5be7ee71314b145a6e591 # v1.8.0 candidate (go-ci-actions#18)
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - name: Test (race)
        run: go test -race ./...
  e2e:
    needs: test
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository))
    permissions:
      contents: read
      id-token: write
    runs-on: arc-gitstead
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ashtonian/go-ci-actions@4425a5fdd39bd4f2fba5be7ee71314b145a6e591 # v1.8.0 candidate (go-ci-actions#18)
        with:
          go-version-file: go.mod
      # The e2e suite spins up a real Forgejo instance via testcontainers; the
      # ubuntu-latest runner has Docker available out of the box.
      - name: E2E (testcontainers/Forgejo)
        run: cd e2e && go test -count=1 -timeout 15m ./...
  vuln:
    needs: acceptance
    if: ${{ !cancelled() && needs.acceptance.outputs.reused != 'true' && github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository)) }}
    permissions:
      contents: read
      id-token: write
    runs-on: arc-gitstead
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ashtonian/go-ci-actions@4425a5fdd39bd4f2fba5be7ee71314b145a6e591 # v1.8.0 candidate (go-ci-actions#18)
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
  lint:
    needs: acceptance
    if: ${{ !cancelled() && needs.acceptance.outputs.reused != 'true' && github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository)) }}
    permissions:
      contents: read
      id-token: write
    runs-on: arc-gitstead
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ashtonian/go-ci-actions@4425a5fdd39bd4f2fba5be7ee71314b145a6e591 # v1.8.0 candidate (go-ci-actions#18)
        with:
          go-version-file: go.mod
      # Build golangci-lint with this module's Go toolchain so its analysis
      # version isn't lower than the module's go directive.
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          "$(go env GOPATH)/bin/golangci-lint" run --timeout=5m
  # Pull requests build linux/amd64 only, without attestations; master builds
  # both platforms and pushes :edge. The binaries are cross-compiled on the
  # runner with its remote build cache; the image build only copies them.
  docker:
    needs: test
    # Runs after the tests pass, or without them when acceptance reused them.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: arc-gitstead
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
      packages: write # :edge, on ghcr.io
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
      PLATFORMS: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ashtonian/go-ci-actions@4425a5fdd39bd4f2fba5be7ee71314b145a6e591 # v1.8.0 candidate (go-ci-actions#18)
        with:
          go-version-file: go.mod
      - name: Cross-compile the binaries
        run: |
          IFS=, read -r -a platforms <<<"$PLATFORMS"
          scripts/build-binaries.sh "$RUNNER_TEMP/image" edge "$GITHUB_SHA" "${platforms[@]}"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (push :edge from master)
        id: artifact-build-1
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/image
          file: Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: ${{ env.PUSH == 'true' }}
          tags: ghcr.io/ashtonian/gitstead:edge
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # Empty keeps build-push-action's defaults for :edge.
          provenance: ${{ env.PUSH != 'true' && 'false' || '' }}
          sbom: ${{ env.PUSH != 'true' && 'false' || '' }}
      - name: Preserve Docker build record
        if: always() && (steps.artifact-build-1.outcome == 'success' || steps.artifact-build-1.outcome == 'failure')
        timeout-minutes: 5
        uses: ashtonian/go-ci-actions/build-record@4425a5fdd39bd4f2fba5be7ee71314b145a6e591 # v1.8.0 candidate (go-ci-actions#18)
        with:
          metadata: ${{ steps.artifact-build-1.outputs.metadata }}
  accepted:
    name: record validation
    needs: [test, e2e, vuln, lint, docker]
    # Without a status function this runs only when every need succeeded.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      id-token: write
    runs-on: arc-gitstead
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ashtonian/go-ci-actions/acceptance@4425a5fdd39bd4f2fba5be7ee71314b145a6e591 # v1.8.0 candidate (go-ci-actions#18)
        with:
          mode: record
          results: ${{ toJSON(needs) }}
          variables: ${{ toJSON(vars) }}
