name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: arc-gitten
    steps:
      - uses: actions/checkout@v7
      - uses: ashtonian/go-ci-actions@853832a13eec9e84695a009516a948fca3ce0e9d # v1.0.0
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - name: Test (race)
        run: go test -race ./...
  e2e:
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: arc-gitten
    needs: [test]
    steps:
      - uses: actions/checkout@v7
      - uses: ashtonian/go-ci-actions@853832a13eec9e84695a009516a948fca3ce0e9d # v1.0.0
        with:
          go-version-file: go.mod
      # The e2e suite spins up a real Forgejo instance via testcontainers; the
      # ubuntu-latest runner has Docker available out of the box.
      - name: E2E (testcontainers/Forgejo)
        run: cd e2e && go test -count=1 -timeout 15m ./...
  vuln:
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: arc-gitten
    steps:
      - uses: actions/checkout@v7
      - uses: ashtonian/go-ci-actions@853832a13eec9e84695a009516a948fca3ce0e9d # v1.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
  lint:
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: arc-gitten
    steps:
      - uses: actions/checkout@v7
      - uses: ashtonian/go-ci-actions@853832a13eec9e84695a009516a948fca3ce0e9d # v1.0.0
        with:
          go-version-file: go.mod
      # Build golangci-lint with this module's Go toolchain so its analysis
      # version isn't lower than the module's go directive.
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          "$(go env GOPATH)/bin/golangci-lint" run --timeout=5m
  docker:
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: arc-gitten
    needs: [test]
    permissions:
      contents: read
      packages: write # :edge, on ghcr.io
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Push only from master, never from a pull request.
      - id: cfg
        run: echo "push=${{ github.event_name != 'pull_request' }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        if: steps.cfg.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore Docker Go caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build-cache
          key: docker-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Dockerfile', 'go.mod', 'go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            docker-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Dockerfile', 'go.mod', 'go.sum') }}-
            docker-go-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore BuildKit Go caches
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          scratch-dir: ${{ runner.temp }}/buildkit-cache-dance
          cache-map: |
            {
              ".build-cache/go-build": "/root/.cache/go-build",
              ".build-cache/go-mod": "/go/pkg/mod"
            }

      - name: Build (push :edge from master)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.cfg.outputs.push == 'true' }}
          tags: ghcr.io/ashtonian/gitten:edge
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            VERSION=edge
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=gitten
          cache-to: type=gha,mode=max,scope=gitten
