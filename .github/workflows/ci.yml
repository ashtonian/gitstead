env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  CI_ARTIFACT_ENDPOINT: ${{ secrets.CI_ARTIFACT_ENDPOINT }}

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # The full, unscoped run; it does nothing when master has not moved since
  # the last green one (go-ci-actions scope).
  schedule:
    - cron: "51 4 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# A newer push to a pull request supersedes its run in progress. Runs for
# master each finish, since each one may publish :edge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The scope job decides which jobs a change needs and which packages they
# check: the changed packages and every package that imports one
# (go-ci-actions scope). A pull request is measured from its base, a push
# from the last green run on master, and the push that merges a pull request
# skips the checks that pull request passed on the same tree
# (go-ci-actions acceptance); it still publishes :edge when the image's
# inputs changed. The nightly schedule, a manual run and the full-ci label
# check everything.
jobs:
  scope:
    name: scope
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository))
    permissions:
      contents: read
      actions: read
      id-token: write
    runs-on: arc-gitstead
    timeout-minutes: 10
    outputs:
      # The checks to run, after the merge push's reuse of its pull request.
      jobs: ${{ steps.accepted.outputs.remaining || steps.scope.outputs.jobs }}
      # What the change touches, for the :edge publish the reuse never skips.
      selected: ${{ steps.scope.outputs.jobs }}
      test-packages: ${{ steps.packages.outputs.test }}
      vuln-packages: ${{ steps.packages.outputs.vuln }}
      lint-packages: ${{ steps.packages.outputs.lint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Go loads the package graph.
      - uses: ashtonian/go-ci-actions@4404b5c0617f86383381bd07ca8a72eeb11863df # v1.10.0
        with:
          go-version-file: go.mod
      # internal/config's tests load examples/*.yaml and config.example.yaml.
      # The e2e module builds the binary (the root package) and drives it.
      - id: scope
        uses: ashtonian/go-ci-actions/scope@4404b5c0617f86383381bd07ca8a72eeb11863df # v1.10.0
        with:
          jobs: |
            {
              "test": {"go": ["./..."]},
              "e2e": {"paths": ["e2e/**"], "go": ["."]},
              "vuln": {"go": ["./..."]},
              "lint": {"paths": [".golangci.yml"], "go": ["./..."]},
              "docker": {"paths": ["Dockerfile", "scripts/build-binaries.sh"], "go": ["."]}
            }
          shared: |
            .github/workflows/ci.yml
          go-owners: |
            {
              "examples/*.yaml": ["./internal/config"],
              "config.example.yaml": ["./internal/config"]
            }
          go-ignore: |
            .github/**
            .gitignore
            .golangci.yml
            .goreleaser.yaml
            CONTRIBUTING.md
            Dockerfile
            LICENSE
            README.md
            SECURITY.md
            SPEC.md
            docs/**
            e2e/**
            examples/README.md
            flake.nix
            nix/**
            scripts/**
      # The packages each Go job checks: the affected ones, or all of them
      # when the job's own files changed or the scope widened.
      - id: packages
        env:
          GO_PACKAGES: ${{ steps.scope.outputs.go-packages }}
          WIDE_JOBS: ${{ steps.scope.outputs.wide-jobs }}
        run: |
          affected=$(jq -r '.["."] // [] | join(" ")' <<<"$GO_PACKAGES")
          for job in test vuln lint; do
            if jq -e --arg job "$job" 'index($job)' <<<"$WIDE_JOBS" >/dev/null; then
              echo "$job=./..." >>"$GITHUB_OUTPUT"
            else
              echo "$job=$affected" >>"$GITHUB_OUTPUT"
            fi
          done
      # The merge push's own checks, without the :edge publish, which only a
      # push does.
      - id: required
        if: github.event_name == 'push'
        env:
          JOBS: ${{ steps.scope.outputs.jobs }}
        run: echo "jobs=$(jq -c 'map(select(. != "docker"))' <<<"$JOBS")" >>"$GITHUB_OUTPUT"
      - id: accepted
        if: github.event_name == 'push'
        uses: ashtonian/go-ci-actions/acceptance@4404b5c0617f86383381bd07ca8a72eeb11863df # v1.10.0
        with:
          mode: verify
          required: ${{ steps.required.outputs.jobs }}
          base: ${{ steps.scope.outputs.base }}
          variables: ${{ toJSON(vars) }}
  test:
    needs: scope
    if: contains(needs.scope.outputs.jobs, '"test"')
    permissions:
      contents: read
      id-token: write
    runs-on: arc-gitstead
    env:
      PACKAGES: ${{ needs.scope.outputs.test-packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ashtonian/go-ci-actions@4404b5c0617f86383381bd07ca8a72eeb11863df # v1.10.0
        with:
          go-version-file: go.mod
      # PACKAGES is a space-separated list of package directories.
      - name: Build
        run: |
          read -r -a packages <<<"$PACKAGES"
          go build "${packages[@]}"
      - name: Vet
        run: |
          read -r -a packages <<<"$PACKAGES"
          go vet "${packages[@]}"
      - name: gofmt
        run: |
          read -r -a packages <<<"$PACKAGES"
          mapfile -t dirs < <(go list -f '{{.Dir}}' "${packages[@]}")
          unformatted=$(gofmt -l "${dirs[@]}")
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - name: Test (race)
        run: |
          read -r -a packages <<<"$PACKAGES"
          go test -race "${packages[@]}"
  e2e:
    needs: [scope, test]
    # After the tests pass, or without them when the change needs only e2e.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && contains(needs.scope.outputs.jobs, '"e2e"') }}
    permissions:
      contents: read
      id-token: write
    runs-on: arc-gitstead
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ashtonian/go-ci-actions@4404b5c0617f86383381bd07ca8a72eeb11863df # v1.10.0
        with:
          go-version-file: go.mod
      # The e2e suite spins up a real Forgejo instance via testcontainers; the
      # runner has Docker available.
      - name: E2E (testcontainers/Forgejo)
        run: cd e2e && go test -count=1 -timeout 15m ./...
  vuln:
    needs: scope
    if: contains(needs.scope.outputs.jobs, '"vuln"')
    permissions:
      contents: read
      id-token: write
    runs-on: arc-gitstead
    env:
      PACKAGES: ${{ needs.scope.outputs.vuln-packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ashtonian/go-ci-actions@4404b5c0617f86383381bd07ca8a72eeb11863df # v1.10.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: |
          read -r -a packages <<<"$PACKAGES"
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" "${packages[@]}"
  lint:
    needs: scope
    if: contains(needs.scope.outputs.jobs, '"lint"')
    permissions:
      contents: read
      id-token: write
    runs-on: arc-gitstead
    env:
      PACKAGES: ${{ needs.scope.outputs.lint-packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ashtonian/go-ci-actions@4404b5c0617f86383381bd07ca8a72eeb11863df # v1.10.0
        with:
          go-version-file: go.mod
      # Build golangci-lint with this module's Go toolchain so its analysis
      # version isn't lower than the module's go directive.
      - name: golangci-lint
        run: |
          read -r -a packages <<<"$PACKAGES"
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          "$(go env GOPATH)/bin/golangci-lint" run --timeout=5m "${packages[@]}"
  # Pull requests and the nightly build linux/amd64 only, without
  # attestations; a push to master (or a manual run there) builds both
  # platforms and pushes :edge. The binaries are cross-compiled on the runner
  # with its remote build cache; the image build only copies them.
  docker:
    needs: [scope, test]
    # After the tests pass, or without them when the change needs no tests or
    # the merge push reused them. A push publishes whenever the image's inputs
    # changed, whatever the reuse.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && contains(github.event_name == 'push' && needs.scope.outputs.selected || needs.scope.outputs.jobs, '"docker"') }}
    runs-on: arc-gitstead
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
      packages: write # :edge, on ghcr.io
    env:
      PUSH: ${{ github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ashtonian/go-ci-actions@4404b5c0617f86383381bd07ca8a72eeb11863df # v1.10.0
        with:
          go-version-file: go.mod
      - name: Cross-compile the binaries
        run: |
          if [[ $PUSH == true ]]; then platforms=(linux/amd64 linux/arm64); else platforms=(linux/amd64); fi
          echo "PLATFORMS=$(IFS=,; echo "${platforms[*]}")" >>"$GITHUB_ENV"
          scripts/build-binaries.sh "$RUNNER_TEMP/image" edge "$GITHUB_SHA" "${platforms[@]}"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (push :edge from master)
        id: artifact-build-1
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/image
          file: Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: ${{ env.PUSH == 'true' }}
          tags: ghcr.io/ashtonian/gitstead:edge
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # Empty keeps build-push-action's defaults for :edge.
          provenance: ${{ env.PUSH != 'true' && 'false' || '' }}
          sbom: ${{ env.PUSH != 'true' && 'false' || '' }}
      - name: Preserve Docker build record
        if: always() && (steps.artifact-build-1.outcome == 'success' || steps.artifact-build-1.outcome == 'failure')
        timeout-minutes: 5
        uses: ashtonian/go-ci-actions/build-record@4404b5c0617f86383381bd07ca8a72eeb11863df # v1.10.0
        with:
          metadata: ${{ steps.artifact-build-1.outputs.metadata }}
  accepted:
    name: record validation
    needs: [scope, test, e2e, vuln, lint, docker]
    # When no selected job failed. The status check must be explicit: with
    # the default success(), a job the scope skipped would skip this one.
    if: ${{ github.event_name == 'pull_request' && !cancelled() && needs.scope.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    permissions:
      contents: read
      id-token: write
    runs-on: arc-gitstead
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ashtonian/go-ci-actions/acceptance@4404b5c0617f86383381bd07ca8a72eeb11863df # v1.10.0
        with:
          mode: record
          results: ${{ toJSON(needs) }}
          variables: ${{ toJSON(vars) }}
