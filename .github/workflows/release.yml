name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write # the images, on ghcr.io

jobs:
  goreleaser:
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: arc-gitten
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ashtonian/go-ci-actions@853832a13eec9e84695a009516a948fca3ce0e9d # v1.0.0
        with:
          go-version-file: go.mod
      - name: Test (race) before release
        run: go test -race ./...
      - uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Private half of ashtonian/homebrew-tap's write deploy key (the
          # default GITHUB_TOKEN can't push to a second repo).
          HOMEBREW_TAP_SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
