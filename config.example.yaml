# gitstead configuration
# Copy to ~/.config/gitstead/config.yaml

# Where to clone repos. Supports ~ expansion.
base_dir: "~/repos"

# Layout under base_dir, by name: owner/name, host/owner/name or name.
# Set this or path_template, not both.
# layout: "owner/name"

# Directory template under base_dir. Available fields:
#   {{.Host}}     - github.com, gitlab.com, ghes.company.com
#   {{.Owner}}    - user or org name
#   {{.Name}}     - repo name
#   {{.FullName}} - owner/name
path_template: "{{.Host}}/{{.Owner}}/{{.Name}}"

# Transport for cloning/fetching: "ssh" (default) or "https".
#   ssh   - uses your SSH agent/keys, or the repo's ssh_key (override, repos:
#           entry, rule, then provider). A repo with an ssh_key gets it written
#           into its own git config as core.sshCommand, so your own git
#           commands there use it too.
#   https - uses git's own credential helper for auth (e.g. `gh auth setup-git`,
#           osxkeychain, or a PAT via the manager) -- gitstead does not store
#           credentials. Override per repo set under `overrides:`.
clone_protocol: "ssh"

# Max concurrent git operations: fetches, backups, and the clones and other
# changes of different repos that sync and apply make.
concurrency: 8

# How long a command waits for another run to finish writing the state file
# before giving up with exit code 75. A write holds the lock for milliseconds:
# clones, fetches, backups and archives all run without it.
lock_timeout: "2m"

# =============================================================================
# Accounts
# =============================================================================
# An account is one identity on one or more hosts. Its SSH key and commit
# identity are used for gitstead's own git commands and written into each repo
# it covers (core.sshCommand, user.name, user.email), including workspace
# clones, so your and your agents' pushes and commits use the right account.
#
# A repo's account: the one named by the most specific of an override, its
# repos: entry, its discovery rule, or that rule's provider (`account:`), else
# the account whose hosts and owners match it. An account with no owners
# covers every owner on its hosts that no other account claims.

accounts: []
  # - name: personal
  #   hosts: [github.com]
  #   ssh_key: "~/.ssh/id_personal"
  #   git: {name: "Your Name", email: "you@example.com"}
  #
  # - name: work
  #   hosts: [github.com]
  #   owners: [acme, acme-labs]
  #   ssh_key: "~/.ssh/id_work"
  #   git: {name: "Your Name", email: "you@acme.com"}
  #   signing:
  #     mode: required                 # inherit (default): leave signing to your
  #                                    # global config; required: sign every
  #                                    # commit and tag; off: never sign here
  #     key: "~/.ssh/id_work.pub"      # user.signingkey; .pub or key:: = SSH, else GPG
  #     format: ssh                    # optional: ssh | openpgp | x509
  #     program: ""                    # optional signer, e.g. 1Password's op-ssh-sign
  #     allowed_signers: ""            # optional gpg.ssh.allowedSignersFile
  #   clone: {filter: "blob:none"}     # how new clones of its repos are made

# =============================================================================
# Provider Instances
# =============================================================================
# Named provider instances. Each discovery rule references one by name.
# You can have multiple instances of the same type (e.g., github.com + GHE).
# Supported types: github, gitlab, gitea, forgejo.

providers:
  # Public GitHub
  - name: "github.com"
    type: "github"
    # Set one of token, token_env or token_command. If it yields nothing,
    # discovery for this provider fails instead of trying another source.
    # With none set, GITHUB_TOKEN is used; without a token only public repos
    # are visible.
    token_command: "gh auth token"

  # GitHub Enterprise example
  # - name: "ghes.company.com"
  #   type: "github"
  #   url: "https://ghes.company.com"      # Required for GHE
  #   token_env: "GHES_TOKEN"              # Custom env var name
  #   token_command: "gh auth token -h ghes.company.com"
  #   ssh_key: "~/.ssh/id_work"            # Default SSH key for all repos from this provider
  #   account: work                        # Or: the account for all repos from this provider
  #   clone_protocol: "https"              # Transport for repos from THIS provider (overrides the top-level default)

  # Self-hosted GitLab example
  # - name: "gitlab.company.com"
  #   type: "gitlab"
  #   url: "https://gitlab.company.com"
  #   token_env: "GITLAB_COMPANY_TOKEN"
  #   ssh_key: "~/.ssh/id_work"

  # Public GitLab
  # - name: "gitlab.com"
  #   type: "gitlab"
  #   token_command: "glab auth token"

  # Gitea / Forgejo example (GitHub-compatible API under /api/v1/)
  # - name: "gitea.company.com"
  #   type: "gitea"                       # or "forgejo" (alias)
  #   url: "https://gitea.company.com"    # /api/v1/ is appended automatically
  #   token_env: "GITEA_TOKEN"

# =============================================================================
# Discovery Rules
# =============================================================================
# Each rule discovers repos from a provider. Repos matching ANY rule are included.

discovery:
  # All repos for a GitHub user
  - name: "my-repos"
    provider: "github.com"
    user: "your-login"                       # Your GitHub username
    include_forks: false
    include_archived: false
    tags: ["personal"]                      # Tags for filtering (gitstead status --tag personal)

  # All repos in a GitHub org
  # - name: "work-org"
  #   provider: "github.com"
  #   org: "my-company"
  #   include_forks: false
  #   include_archived: false
  #   tags: ["work"]
  #   ssh_key: "~/.ssh/id_work"            # Override SSH key for this rule

  # Only some of an org's repos, by name: globs, any of them, ignoring case
  # - name: "billing"
  #   provider: "github.com"
  #   org: "my-company"
  #   names: ["*billing*", "*payments*"]   # Names containing billing or payments

  # Filter by name pattern (regex)
  # - name: "work-services"
  #   provider: "ghes.company.com"
  #   org: "platform"
  #   name_pattern: "^svc-"                # Only repos starting with "svc-"
  #   affiliation: [owner]                 # GitHub rule without user/org: only repos the token's
  #                                        # account owns (also: collaborator, organization_member)
  #   tags: ["work", "services"]

  # Filter by topic
  # - name: "go-projects"
  #   provider: "github.com"
  #   user: "your-login"
  #   topics: ["go"]                       # Repo must have ALL listed topics
  #   languages: ["Go"]                    # Any of the repo's languages, case-insensitive
  #   tags: ["go"]

  # GitLab group (use 'group' for gitlab; 'org' for github/gitea)
  # - name: "gitlab-team"
  #   provider: "gitlab.company.com"
  #   group: "my-team/backend"             # Includes subgroups
  #   tags: ["work", "backend"]

  # Raw provider search query (mutually exclusive with user/org/group and the
  # structured filters; uses the provider's native search syntax).
  # GitHub caps search at 1000 results — discover warns if a query exceeds it.
  # - name: "go-stars"
  #   provider: "github.com"
  #   query: "org:acme language:go stars:>50"
  #   tags: ["oss"]

# =============================================================================
# Manual Repos
# =============================================================================
# Individual repos to manage without discovery rules.
# Useful for one-off repos that don't fit any discovery pattern.

repos: []
  # - url: "git@github.com:someone/useful-fork.git"
  #   tags: ["libs"]
  #   ssh_key: "~/.ssh/id_personal"
  #   path: "~/forks/useful"          # instead of where path_template puts it:
  #                                    # absolute, ~-relative or relative to base_dir
  #
  # - url: "git@gitlab.com:other-org/special-project.git"
  #   tags: ["work"]

# A shared file of repos tracked by hand -- cloned, adopted, imported -- that
# every machine reads as more repos: entries and gitstead keeps up to date:
# clone, adopt and manifest import add to it, remove takes from it. Keep it in
# your dotfiles or a synced folder. "" = none; gitstead never writes this config.
manifest: ""

# =============================================================================
# Exclude Rules
# =============================================================================
# Repos matching ANY exclude rule are skipped, even if a discovery rule found them.

exclude: []
  # Regex on repo name
  # - name_pattern: "^deprecated-"
  #
  # Globs on repo name, any of them, ignoring case
  # - names: ["*-sandbox", "*-experiment"]
  #
  # Repo keys, or globs over them as in overrides
  # - repos:
  #   - "github.com/my-company/legacy-monolith"
  #   - "github.com/my-company/old-*"

# =============================================================================
# Named Sets
# =============================================================================
# Reusable repo selections, usable as `--set <name>` on status/sync/backup/run/
# remove/remote-sync. A repo is in a set if its key matches any `repos` glob,
# it carries any of `tags`, an account in `accounts` covers it, or a discovery
# rule in `rules` found it (all empty = all repos); `exclude_archived` then
# drops archived repos. --set composes with (AND) inline --repos/--tag.

sets: []
  # - name: work
  #   accounts: ["work"]
  # - name: core
  #   repos:
  #     - "github.com/acme/api"
  #     - "github.com/acme/web"
  # - name: active-backend
  #   tags: ["backend"]
  #   exclude_archived: true

# =============================================================================
# Per-Repo Overrides
# =============================================================================
# Override settings for specific repos. Matched by full key (host/owner/name)
# or glob, in which * matches any run of characters, slashes included (so
# "ghes.company.com/*" is every repo on that host and "*/api" every repo named
# api), ? one character and [...] one of a class. Later entries take
# precedence, for every setting.

overrides: []
  # Override by glob - all company repos
  # - repos: ["ghes.company.com/*"]
  #   base_dir: "~/work"                    # Clone this set under a different root
  #   ssh_key: "~/.ssh/id_work"
  #   backup:
  #     strategy: "patch"                   # No custom refs in company repos
  #   remote_sync:
  #     enabled: false
  #
  # Track a repo but never auto-fetch it (e.g. a frozen archive)
  # - repos: ["github.com/company/archived-thing"]
  #   sync:
  #     enabled: false
  #
  # Override by exact repo
  # - repos: ["github.com/company/huge-monorepo"]
  #   sync:
  #     timeout_per_repo: "15m"
  #   backup:
  #     include_untracked: false            # Too many generated files
  #   clone:
  #     filter: "blob:none"                 # file contents fetched as checked out
  #     depth: 100                          # the last 100 commits of every branch
  #
  # Custom path for dotfiles
  # - repos: ["github.com/your-login/dotfiles"]
  #   path_template: "{{.Name}}"           # Clone to ~/repos/dotfiles

# =============================================================================
# Clones
# =============================================================================
# How new clones of tracked repos are made; also per account and per override.
# Existing clones keep how they were made. Workspace worktrees share their
# repo's clone and so its filter and depth; workspace clones can't be made from
# a partial (filtered) clone, so such repos only get worktrees.

clone:
  filter: ""          # partial clone: blob:none, blob:limit=<size> or tree:<depth>
  depth: 0            # commits of history per branch; 0 = all
  # Check out only these directories (cone mode: files at the top, and directly
  # in each one's parents, come too). Empty = everything. New checkouts only:
  # the repo's clone and each workspace copy. With filter: blob:none, files
  # outside them are never downloaded.
  sparse: []
  # Check out submodules, recursively (only those inside sparse), cloned with
  # filter and depth too. New checkouts only.
  submodules: false
  # Git LFS: "auto" downloads what each checkout needs; "skip" leaves LFS files
  # as pointers and downloads nothing (lfs.fetchexclude=* in the repo's git
  # config, so it reaches existing clones too).
  lfs: auto

# =============================================================================
# Sync Settings
# =============================================================================

sync:
  # Run discovery before every sync (auto-clone new repos).
  auto_discover: true

  # Minimum time between fetches for the same repo.
  # Frequent cron runs skip recently-fetched repos.
  min_fetch_interval: "10m"

  # Deadlines. Each bounds one external call; when it passes, git and
  # everything it started (ssh, credential helpers) is killed and the error
  # names the setting. 0 means no deadline.
  #
  # One repo's fetch, retries included.
  timeout_per_repo: "5m"
  # One working copy's backup. It runs before the fetch, on its own budget,
  # so a slow remote can't starve it.
  backup_timeout: "2m"
  # One clone; and archiving a clone or copy before it is removed.
  clone_timeout: "30m"
  # One look at a working copy -- its git config and identity -- while planning.
  inspect_timeout: "1m"
  # One provider API request attempt. Retries, and the waits a rate limit
  # asks for, are bounded by discovery_timeout instead.
  api_timeout: "60s"
  # One discovery rule: listing plus language/topic lookups, retries and
  # rate-limit waits included.
  discovery_timeout: "5m"

  # Retries on transient network failures (per repo).
  retries: 2

  # Retry backoff base. Actual delay: base * 2^attempt.
  retry_backoff: "2s"

  # After fetching a tracked clone: "off" leaves its branch where it is;
  # "ff-only-clean" fast-forwards it to its upstream when it is behind and
  # not ahead, has no uncommitted changes to tracked files and no git command
  # runs in it; an untracked or ignored file in the way stops it too. Anything
  # else is left as it is, with the reason logged.
  # Workspace copies are never updated. Per repo through overrides[].sync.
  update: "off"

# =============================================================================
# Config Changes
# =============================================================================
# Every run compares what config wants with what gitstead last set (state) and
# what is on disk; `gitstead plan` shows the difference, `gitstead apply` makes it.

reconcile:
  # What sync and discover --apply change on their own:
  #   safe - everything that moves and deletes nothing: clone new or deleted
  #          repos, change origin URLs, write managed git config, retag
  #   all  - also move repos to new paths
  #   none - only report
  # Moves and removals of workspace copies always wait for `gitstead apply`.
  auto: "safe"

  # A value gitstead set (origin URL, core.sshCommand) that was changed by hand:
  #   report    - leave it and list it
  #   overwrite - put gitstead's value back
  drift: "report"

# =============================================================================
# Cleanup Policy (Stale Repos)
# =============================================================================

cleanup:
  # What happens when a repo is no longer found by discovery:
  #   mark_stale       - Set status to "stale" (visible in `gitstead status --stale`)
  #   remove           - Remove from state after grace_period (keep files on disk)
  #   archive          - Remove from state after grace_period and move the clone,
  #                       whole, into backup.archive_dir (`gitstead archives
  #                       restore` puts it back); a clone with linked worktrees
  #                       or workspace copies is kept and stays tracked
  #   remove_and_delete - Remove from state AND delete from disk after grace_period
  #                       (unique work is archived to backup.archive_dir first,
  #                       in a bundle of the repo's whole history that restores
  #                       with no upstream; a repo that can't be archived, or
  #                       that git is busy in, is kept and stays tracked)
  #   ignore           - Never mark stale: such repos keep syncing. Manual cleanup only.
  # A stale repo is no longer fetched or pushed offsite (its upstream is gone),
  # but its local work is still backed up.
  policy: "mark_stale"

  # Grace period before remove, archive or remove_and_delete takes effect.
  grace_period: "720h"    # 30 days

  # Never judge repos added by hand: `gitstead clone`, `adopt`, and `repos:`
  # entries. Dropping a repos: entry leaves the repo tracked; `gitstead
  # remove` stops tracking it.
  protect_manual: true

# =============================================================================
# Backup Settings
# =============================================================================

backup:
  # Enable transparent backup of uncommitted changes during sync.
  enabled: true

  # Each backup is a snapshot of the index, the working tree and the untracked
  # files, taken without touching the index or index.lock. Strategy picks where
  # it is kept:
  #   stash-ref - a stash-format commit at refs/gitstead/backups/<copy>/<id>;
  #               restore with `git stash apply --index <ref>`.
  #   patch     - patches + a tarball under patch_dir; outlives the repo.
  #   both      - both.
  strategy: "both"

  # Back up untracked files (ignored files never are).
  include_untracked: true

  # Untracked files over these sizes are left out of the backup and reported.
  max_untracked_file_mb: 50
  max_untracked_total_mb: 500

  # Retention, per working copy (each clone and each worktree): every backup
  # younger than keep_all, then the newest backup of each day younger than
  # keep_daily, then at most max_per_copy (0 = no cap). The newest backup is
  # always kept, and an unchanged state is never saved twice.
  keep_all: "24h"
  keep_daily: "336h"
  max_per_copy: 100

  # Patch file storage directory.
  # Default: ~/.local/share/gitstead/patches/
  patch_dir: ""

  # Before gitstead deletes a clone or worktree (ws rm --delete, ws prune,
  # remove --delete, stale cleanup), any unique work -- uncommitted changes,
  # untracked files, stashes, unpushed commits -- is saved here as a verified
  # git bundle with a .json file describing how to restore it. If that fails,
  # nothing is deleted. Clones archived whole (cleanup.policy archive, remove
  # --archive) are moved here too. `gitstead archives ls` lists everything here.
  # Default: ~/.local/share/gitstead/archive/
  archive_dir: ""

# =============================================================================
# Mirrors
# =============================================================================
# A full mirror of each repo's upstream -- every branch, tag and ref the host
# has -- as a bare repo, made and updated by sync: a copy that outlives the host
# losing the repo. Updates never prune, so a branch deleted upstream stays,
# and the old tip of a branch rewritten upstream (force-pushed) is kept for
# keep_rewritten under refs/gitstead-rewritten/<time>/.
# accounts[].mirror and overrides[].mirror ({enabled, lfs}) set it per repo.

mirror:
  enabled: false
  dir: ""                  # <dir>/<host>/<owner>/<name>.git; "" = ~/.local/share/gitstead/mirrors
  interval: "24h"          # how often sync updates each mirror
  lfs: false               # also mirror Git LFS content
  keep_rewritten: "2160h"  # keep rewritten branches' old tips 90 days; "0s" keeps none

# =============================================================================
# Remote Sync
# =============================================================================

remote_sync:
  # Take each working copy offsite during sync: uncommitted work and commits
  # no remote has, pushed under a hidden namespace the copy owns. Each
  # checked-out submodule goes too, as a working copy of its own, to its own
  # remote. `gitstead remote-sync` does it on demand either way. Any key below
  # can be set per account (accounts[].remote_sync) or per repo
  # (overrides[].remote_sync).
  enabled: false

  # A remote name, or a URL template ({{.Host}}, {{.Owner}}, {{.Name}},
  # {{.FullName}}) for a separate backup remote, e.g.
  # "git@backup.example:{{.Host}}/{{.FullName}}.git". A submodule uses the
  # remote of that name in it, or the template filled in from its origin.
  # Hidden refs don't show in branch lists or trigger CI, but anyone who can
  # read the remote can fetch them.
  remote: "origin"

  # Uncommitted work: "ref" pushes each new backup to <namespace>/wip/<id>
  # (untracked files and the staged/unstaged split included); "branch" pushes
  # a visible branch gitstead/wip/<machine>/<copy> (tracked changes only, on
  # top of HEAD); "off" pushes none.
  wip: "ref"

  # Commits no remote has: "push" saves each such branch as
  # <namespace>/heads/<branch> (your branches are never pushed); "bundle"
  # writes them to backup.archive_dir/unpushed/<copy>.bundle (protects against
  # a deleted branch, not a lost disk); "off" does neither.
  unpushed: "push"

  # The hidden ref prefix each copy owns on the remote. Must stay under refs/,
  # outside branches and tags, and include {{.Copy}}.
  namespace: "refs/gitstead/{{.Machine}}/{{.Copy}}"

  # How long a pushed WIP ref stays; the current one always stays.
  keep: "720h"

# =============================================================================
# Hooks
# =============================================================================
# Commands gitstead runs, each with /bin/sh -c, in a checkout it has just made:
#   post_clone  - in a repo's new clone (not one adopted where it was)
#   post_create - in a new workspace copy, after the repo's post_create comes
#                 the workspace's (workspace_defaults.hooks / workspaces[].hooks)
# Set here, per account (accounts[].hooks) or per repo (overrides[].hooks); the
# most specific list wins, and an empty list runs nothing. Each command runs
# in order with no input and no terminal; the first that fails stops the rest,
# the checkout is kept and recorded, and the failure is reported. Output goes
# to <state dir>/hooks/<checkout>.<event>.log. Hooks come only from this file,
# never from a repository. Environment: GITSTEAD_EVENT, GITSTEAD_PATH,
# GITSTEAD_REPO, GITSTEAD_SOURCE (the repo's clone), GITSTEAD_WORKSPACE,
# GITSTEAD_AGENT, GITSTEAD_BRANCH. `gitstead hooks post-clone|post-create` runs
# them again.

hooks:
  post_clone: []           # e.g. ["direnv allow", "mise install"]
  post_create: []          # e.g. ["npm ci"] -- per repo, in overrides[].hooks
  timeout: "15m"           # each command; 0 = none

# =============================================================================
# Notifications
# =============================================================================

notify:
  # Native OS notifications (macOS Notification Center / Linux notify-send).
  # Silently ignored in Docker/headless.
  enabled: false
  on_error: true           # Notify when repos fail to sync
  on_completion: false     # Notify on every sync (noisy for cron)
  on_stale: true           # Notify when new stale repos detected
  on_waiting: true         # Notify when an agent is waiting for you
  # An agent in a tmux pane that printed for a while and then nothing for this
  # long counts as waiting; 0 = only what agents report (gitstead ws waiting).
  waiting_after: "30s"
  timeout: "10s"           # how long sending one notification may take

# =============================================================================
# Logging
# =============================================================================

log:
  level: "info"            # debug, info, warn, error
  format: "json"           # json or text
  file: ""                 # Log to file in addition to stderr, at level (--quiet only quiets stderr)
                           # e.g., "~/.local/share/gitstead/gitstead.log"
  events: true             # write the operation log (events.jsonl, read by report/log); false to disable

# The command `gitstead open` opens a repo or workspace with; the path is added
# as its last argument. Empty uses $VISUAL, then $EDITOR.
editor: ""                          # e.g. "code -n", "cursor", "nvim"

# =============================================================================
# Agents and Workspaces
# =============================================================================
# A workspace is one repo, or several related ones, worked on by N agents.
# Each agent gets a replica of its own: a linked worktree of each repo's clone
# by default, on a branch of its own. Declare workspaces here and run
# `gitstead apply` (or `gitstead ws ensure`), or create one from the command line:
#
#   gitstead ws create app --repo github.com/me/app --agents 4
#   gitstead ws create platform --repo github.com/me/api --repo github.com/me/web --agents 2
#
# --save writes a workspace made from flags back here.

# Agent commands. Each is typed into an interactive shell in the agent's
# replica, so shell functions and aliases work. With none declared, claude and
# codex are offered when they are on PATH.
agents: []
  # - name: claude
  #   command: "claude"
  #   resume: "claude --continue"   # typed instead when the agent ran here before
  #   env: {}                       # extra environment for the agent
  #   status: ""                    # a command whose first line ws status shows while it runs
  # - name: codex
  #   command: "codex"

# Settings every workspace starts from.
workspace_defaults:
  root: "~/workspaces"              # each workspace lives in <root>/<name>
  # How each agent's copies are made:
  #   worktree        - a linked worktree of the repo's clone: shares its
  #                     objects and fetches, costs only the checkout
  #   clone           - a clone with objects of its own, hardlinked from the
  #                     repo's clone (copied across filesystems)
  #   reference-clone - a clone borrowing the repo's clone's objects; gitstead
  #                     stops git gc there from pruning objects the copies use
  #   shared          - every agent works in one folder: the repo's clone, or
  #                     a workspace's path
  isolation: "worktree"
  agents: 1                         # agents per workspace
  agent_name: "agent-{{.N}}"        # {{.N}}, {{.Workspace}}
  # A new copy's branch ({{.Workspace}}, {{.Agent}}, {{.N}}, {{.Repo}});
  # existing copies keep theirs.
  branch: "agents/{{.Workspace}}/{{.Agent}}"
  base_ref: ""                      # new branches start here; "" = upstream's default branch
  agent: ""                         # the profile agents run; "" = the first one
  # Each agent's own block of ports: GITSTEAD_PORT .. GITSTEAD_PORT+count-1,
  # kept for its folder's life. base 0 = none.
  ports: {base: 41000, count: 10}
  # Set for each agent's commands (its run, ws exec, post_create hooks). Values
  # are templates: {{.Workspace}} {{.Agent}} {{.N}} {{.Replica}} {{.Port}}
  # {{.Ports}} {{.Cache}} {{add .Port 1}}. A workspace's env adds to these.
  env: {}
  #   PORT: "{{.Port}}"
  #   DATABASE_URL: "postgres://localhost/app_{{.N}}"
  #   SCCACHE_DIR: "{{.Cache}}/sccache"
  # Holds <workspace>/, a cache directory its agents share (GITSTEAD_CACHE);
  # deleted with the workspace. "" = $XDG_CACHE_HOME/gitstead/workspaces.
  cache_root: ""
  # Run in each new copy after its repo's post_create hooks, unless a
  # workspace sets its own (hooks: {post_create: [...]}; [] for none).
  hooks:
    post_create: []                 # e.g. ['cp "$GITSTEAD_SOURCE/.env" .env', "direnv allow"]

workspaces: []
  # One repo, four agents: ~/workspaces/app/agent-1 .. agent-4.
  # - name: app
  #   repos: [github.com/me/app]    # tracked keys, globs, local paths or URLs;
  #   agents: 4                     # an untracked path is adopted, a URL cloned
  #
  # Related repos together: each agent gets ~/workspaces/platform/agent-N/{api,web}.
  # - name: platform
  #   repos: [github.com/me/api, github.com/me/web]
  #   agents: 2
  #   remote_sync: {wip: branch}    # remote_sync for these copies
  #
  # Every repo in a named set, one agent reviewing them.
  # - name: review
  #   set: backend
  #
  # Agents sharing one folder that isn't a repo.
  # - name: notes
  #   path: ~/notes                 # path implies isolation: shared
  #   agents: 2

# =============================================================================
# Fleets and Launchers
# =============================================================================
# A fleet opens several workspaces' agents side by side with one launcher:
# `gitstead fleet open <name>`. Each agent's terminal runs `gitstead ws run`,
# which checks its copies, runs its agent and leaves a shell.

fleets: []
  # - name: daily
  #   workspaces: [app, platform, notes]
  #   agent: claude                 # every agent runs this profile; default each workspace's
  #   launcher: tmux                # tmux | iterm | muxy | auto | a plugin's name
  #   host: ""                      # SSH destination the workspaces live on;
  #   remote_command: gitstead       # gitstead there makes the plan

launchers:
  default: auto       # auto: tmux inside tmux, Muxy inside Muxy, iTerm inside iTerm, else tmux
  title: "{{.Workspace}}/{{.Agent}}"   # each terminal's name ({{.Fleet}}, {{.Profile}} too)
  check: true         # each terminal checks its agent's copies first
  keep_shell: true    # leave a shell in the replica when the agent exits

  tmux:               # a session per fleet, a window per workspace, a pane per agent
    session: "gitstead-{{.Fleet}}"
    window_per: workspace         # workspace | agent
    layout: tiled                 # tiled | even-horizontal | even-vertical | main-vertical | main-horizontal
    max_panes: 4                  # more agents spill into another window
    pane_titles: true
    control_mode: auto            # attach with tmux -CC (native iTerm windows): auto | always | never
    socket: ""                    # a separate tmux server (tmux -L)
    on_exists: add-missing        # attach | add-missing | recreate
    remain_on_exit: true

  iterm:              # a window per fleet, a tab per workspace, a split per agent
    window: new                   # new | current
    tab_per: workspace            # workspace | agent
    split: grid                   # grid | columns | rows
    max_panes: 4
    profile: Default
    badge: "{{.Agent}}"           # pane watermark; "" turns it off
    focus: true
    type_delay: 150ms             # pause before typing into a new split

  muxy:               # a project per workspace, a tab per agent
    host: ""                      # Muxy server over SSH; "" = the fleet's host, or this machine
    project_name: "{{.Workspace}}"
    # layout:   write .muxy/layouts/<name>.json; open it with Apply Layout
    # sessions: start agents as server sessions, under Existing Terminals
    # state:    add tabs to the desktop app's saved state (format 3), restarting it
    open: layout
    layout_name: ""               # default: the agents' profile
    restart: ask                  # open: state may quit the app: ask | always | never
    color: auto                   # auto | none | #RRGGBB
    prune_projects: false         # remove projects of workspaces no longer in the fleet
    command: ""                   # the muxy CLI; default muxy on PATH, else the app's

  plugins: {}         # options for gitstead-launch-<name> executables
    # wezterm: {tabs: per-agent}
