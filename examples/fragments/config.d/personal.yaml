# Personal work, from a private overlay of its own, linked in as
# ~/.config/gitstead/config.d/personal.yaml.
accounts:
  - name: personal
    hosts: [github.com]
    owners: [your-login]
    ssh_key: ~/.ssh/id_personal
    git: { name: Your Name, email: you@example.com }

repos:
  - url: git@github.com:your-login/app.git
  - url: git@github.com:your-login/dotfiles.git

workspaces:
  - name: app
    repos: [github.com/your-login/app]

# The one file that names your machines (each one's macOS local host name,
# or GITSTEAD_MACHINE), and gives each the alias the other files key their
# sections by, so they never hold the names.
machines:
  My-Mac-Studio:
    aliases: [desktop]
    workspaces:
      - name: app            # more agents on the desktop
        agents: 4
  My-MacBook-Air:
    aliases: [laptop]
