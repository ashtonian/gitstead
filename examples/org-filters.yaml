# Only some of an organization's repos: its Go services, its Terraform
# modules, and nothing archived or experimental. Sets then name groups of
# them for bulk work: `gitstead run --set services -- make test`.
base_dir: ~/code
layout: owner/name

providers:
  - name: github.com
    type: github
    token_command: gh auth token --hostname github.com

discovery:
  - name: acme-services
    provider: github.com
    org: acme
    languages: [Go]                 # any of these
    topics: [service]               # all of these
    names: ["svc-*"]                # globs on the name, any of them, ignoring case
    tags: [services]
  - name: acme-terraform
    provider: github.com
    org: acme
    languages: [HCL]
    name_pattern: "^terraform-"     # or a regular expression
    visibility: private
    tags: [infra]

exclude:
  - names: ["*-sandbox", "*-experiment"]
  - repos: ["github.com/acme/svc-legacy-*"]   # repo keys or globs over them

sets:
  - name: services
    tags: [services]
    exclude_archived: true
  - name: infra
    rules: [acme-terraform]
